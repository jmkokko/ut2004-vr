[VR]
; fraction of SteamVR's recommended resolution per eye (1.0 = 3152 px on your headset; 0.65 = 2048)
RenderScale=0.65
; 1 = run the game on D3D9Ex and hand the eye images to SteamVR on the GPU (fast); 0 = CPU copy (slow fallback)
GPUShare=1
Port=7790
Mock=0
MockDemo=0
DumpEyes=0
; mirror for the desktop window / recording: 0 = left eye, 1 = right eye, -1 = off (plain mono view)
MirrorEye=0
; 1 = crop the eye to fill the window, 0 = letterbox the whole eye view
MirrorFill=1
; >1 widens the mirror slightly past the lens edge (the eye image is rendered wider than the lens shows)
MirrorZoom=1.08
